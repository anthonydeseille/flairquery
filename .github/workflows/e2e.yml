name: e2e

# End-to-end test on kind for every pull request (and on demand).
on:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: corpus profile
        default: M
        type: choice
        options: [M, S]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e on kind
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space (corpus M + images)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: kind + kubectl (pinned, checksums verified)
        run: make tools
      - name: make e2e
        run: make e2e
        env:
          E2E_PROFILE: ${{ inputs.profile || 'M' }}
