# Local playground without Kubernetes: PostgreSQL 16 only (the demo app runs on the host with the agent).
# Used by `make demo-local`. Data lives in a named volume removed by `make demo-local-clean`.
name: flairquery-local
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: flairquery
      POSTGRES_USER: flairquery
      POSTGRES_PASSWORD: flairquery
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/postgresql-fq.conf:/etc/postgresql/postgresql.conf:ro
      - ../postgres/init-fq.sql:/docker-entrypoint-initdb.d/10-init-fq.sql:ro
    # auto_explain logs every plan in dev: cap container logs (a corpus load once produced 14 GB)
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flairquery -d flairquery"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
