# FlairQuery observation settings (dev). Mounted into the official postgres:16 image.
listen_addresses = '*'
shared_preload_libraries = 'pg_stat_statements,auto_explain'
compute_query_id = on
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_io_timing = on

# auto_explain: every statement in dev (log_min_duration = 0); plans go to the server log
auto_explain.log_min_duration = 0
auto_explain.log_analyze = off
auto_explain.log_format = json
auto_explain.log_nested_statements = on

# Deliberately small (phase 6 targets): the corpus is larger than shared_buffers, sorts spill (TRAP 7)
shared_buffers = 32MB
work_mem = 64kB
max_connections = 50
