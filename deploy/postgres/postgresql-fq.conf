# FlairQuery observation settings (dev). Shared by the local Compose environment, the kind deployment and
# the Testcontainers integration tests.
listen_addresses = '*'
shared_preload_libraries = 'pg_stat_statements,auto_explain'
compute_query_id = on
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_io_timing = on

# auto_explain: every statement in dev (log_min_duration = 0); plans in JSON. In production use a
# threshold (e.g. 200ms): only slow statements are then precisely mapped to their endpoint.
auto_explain.log_min_duration = 0
auto_explain.log_analyze = off
auto_explain.log_format = json
auto_explain.log_nested_statements = on

# Server log as JSON files (PG15+): every entry carries query_id, and auto_explain entries carry the
# executed text with its fq: tag. The collector reads them through SQL (pg_ls_logdir / pg_read_file),
# read-only. Bounded: one file per hour of the day, overwritten the next day (at most 24 files).
logging_collector = on
log_destination = 'jsonlog'
log_directory = 'log'
log_filename = 'postgresql-%H.log'
log_rotation_age = 60
log_rotation_size = 0
log_truncate_on_rotation = on

# Deliberately small (phase 6 targets): the corpus is larger than shared_buffers, sorts spill (TRAP 7)
shared_buffers = 32MB
work_mem = 64kB
max_connections = 50
