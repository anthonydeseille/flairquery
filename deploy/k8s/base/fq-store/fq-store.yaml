# fq-store: the collector's OWN database (snapshots, plans, marks). Never the observed database.
# Plain PostgreSQL 16, not instrumented. The collector creates its schema (Liquibase) at startup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fq-store-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fq-store
  labels:
    app.kubernetes.io/name: fq-store
    app.kubernetes.io/component: collector-store
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fq-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fq-store
        app.kubernetes.io/component: collector-store
    spec:
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - secretRef:
                name: fq-store-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fq-store-data
---
apiVersion: v1
kind: Service
metadata:
  name: fq-store
  labels:
    app.kubernetes.io/name: fq-store
spec:
  selector:
    app.kubernetes.io/name: fq-store
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
