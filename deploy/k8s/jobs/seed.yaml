# Corpus seeding through COPY (never Liquibase). __PROFILE__ is replaced by `make seed PROFILE=S|M`.
# Waits for the schema created by the demo app (Liquibase) before loading.
apiVersion: batch/v1
kind: Job
metadata:
  name: fq-seed
  labels:
    app.kubernetes.io/name: fq-seed
    app.kubernetes.io/part-of: flairquery
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fq-seed
        app.kubernetes.io/part-of: flairquery
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: flairquery/tools:dev
          imagePullPolicy: IfNotPresent
          command: ["/opt/flairquery/corpus/load.sh", "__PROFILE__", "__FORCE__"]
          env:
            - {name: PGHOST, value: postgres}
            - {name: PGDATABASE, valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_DB}}}
            - {name: PGUSER, valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_USER}}}
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}}}
            - {name: FQ_SEED_WAIT_SECONDS, value: "600"}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
